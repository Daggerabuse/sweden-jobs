[project]
name = "sweden-jobs"
version = "0.1.0"
description = "Pipeline and analysis of IT job ads in Sweden from the JobTech API"
readme = "README.md"
authors = [
    { name = "Mete Cem Bulut", email = "metecem22@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "altair>=6.3.0",
    "duckdb>=2.0.0",
    "pandas>=3.1.0",
    "requests>=2.34.2",
    "streamlit>=1.66.1",
    "urllib3>=2.8.0",
]

[project.scripts]
sweden-jobs = "sweden_jobs.fetch:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
